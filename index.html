<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grocery & Shopping List</title>
<meta name="theme-color" content="#3f7d5c">
<meta name="description" content="Keep a list of everyday items and build your shopping list with one tap.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#faf9f7; --card:#ffffff; --text:#1c1c1c; --muted:#767268;
    --accent:#3f7d5c; --accent-bg:#e7f2ec; --border:#e6e2da; --danger:#b3543f;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#171614; --card:#221f1c; --text:#f1efe9; --muted:#9b968b;
      --accent:#7fc9a0; --accent-bg:#25332b; --border:#33302b; --danger:#e08a72;
    }
  }
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; max-width:520px; margin:0 auto;
  }
  header{
    padding:18px 16px 8px; position:sticky; top:env(safe-area-inset-top,0px);
    background:var(--bg); z-index:2;
  }
  h1{font-size:1.25rem; margin:0 0 12px;}
  .tabs{display:flex; gap:8px;}
  .tab{
    flex:1; padding:10px; text-align:center; border-radius:10px; border:1px solid var(--border);
    background:var(--card); cursor:pointer; font-size:0.95rem; color:var(--muted); position:relative;
  }
  .tab.active{background:var(--accent-bg); color:var(--accent); border-color:var(--accent); font-weight:600;}
  .badge{
    display:inline-block; min-width:18px; padding:0 5px; margin-left:6px; border-radius:9px;
    background:var(--accent); color:#fff; font-size:0.72rem; line-height:18px;
  }
  main{flex:1; overflow-y:auto; padding:0 16px 24px;}
  .panel{display:none;}
  .panel.active{display:block;}
  .add-row{display:flex; gap:8px; margin:12px 0;}
  input[type="text"]{
    flex:1; padding:11px 12px; border-radius:10px; border:1px solid var(--border);
    background:var(--card); color:var(--text); font-size:1rem; min-width:0;
  }
  button{
    border:none; border-radius:10px; padding:11px 14px; font-size:0.95rem; cursor:pointer;
    background:var(--accent); color:#fff;
  }
  .link-btn{
    background:none; color:var(--accent); padding:4px 0; font-size:0.85rem; text-decoration:underline;
  }
  ul{list-style:none; margin:0; padding:0;}
  li{display:flex; align-items:center; gap:8px; padding:12px 4px; border-bottom:1px solid var(--border);}
  li .name{flex:1; word-break:break-word;}
  li.in-list .name{color:var(--accent); font-weight:600;}
  .dot{width:9px; height:9px; border-radius:50%; border:2px solid var(--border); flex:none;}
  li.in-list .dot{background:var(--accent); border-color:var(--accent);}
  .empty{color:var(--muted); text-align:center; padding:32px 0;}
  .del{color:var(--danger); font-size:0.85rem; flex:none;}
  select.cat-select{
    padding:6px 8px; border-radius:8px; border:1px solid var(--border);
    background:var(--card); color:var(--text); font-size:0.82rem; flex:none; max-width:110px;
  }
  .cat-group h3{
    font-size:0.75rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);
    margin:18px 0 2px; padding-top:4px;
  }
  .cat-group:first-child h3{margin-top:4px;}
  .cat-manage{
    margin:10px 0 4px; padding:10px; border:1px solid var(--border); border-radius:10px; background:var(--card);
  }
  .cat-manage.hidden{display:none;}
  .cat-row{display:flex; align-items:center; gap:8px; padding:6px 0;}
  .cat-row .name{flex:1;}
  .cat-row .del{cursor:pointer;}
</style>
</head>
<body>
<header>
  <h1>My Groceries</h1>
  <div class="tabs">
    <div class="tab active" data-tab="all">All Items</div>
    <div class="tab" data-tab="shop">Shopping List<span id="countBadge" class="badge" style="display:none">0</span></div>
  </div>
</header>
<main>
  <div id="panel-all" class="panel active">
    <div class="add-row">
      <input type="text" id="search" placeholder="Search or add an item...">
      <button id="addBtn">Add</button>
    </div>
    <span id="toggleCatManage" class="link-btn" style="cursor:pointer;">Manage categories</span>
    <div id="catManage" class="cat-manage hidden">
      <div class="add-row" style="margin:0 0 6px;">
        <input type="text" id="newCatName" placeholder="New category name">
        <button id="addCatBtn">Add</button>
      </div>
      <div id="catListManage"></div>
    </div>
    <ul id="masterList"></ul>
    <div id="masterEmpty" class="empty" style="display:none">No items yet — add your first one above.</div>
  </div>
  <div id="panel-shop" class="panel">
    <ul id="shopList"></ul>
    <div id="shopEmpty" class="empty">Nothing needed right now. Tap items on "All Items" to add them here.</div>
  </div>
</main>
<script>
let state = { master: [], shopping: [], categories: [] };
const KEY = "grocery-app-state";
const UNCAT = "__uncat__";

function uid(){ return Math.random().toString(36).slice(2,9); }
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    const parsed = raw ? JSON.parse(raw) : {};
    return {
      master: parsed.master || [],
      shopping: parsed.shopping || [],
      categories: parsed.categories || []
    };
  }catch(e){ return { master: [], shopping: [], categories: [] }; }
}
function save(newState){
  state = newState;
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  render();
}
function toggleShopping(id){
  const inList = state.shopping.includes(id);
  save({ ...state, shopping: inList ? state.shopping.filter(x=>x!==id) : [...state.shopping, id] });
}
function addItem(name){
  name = name.trim();
  if(!name) return;
  if(state.master.some(i=>i.name.toLowerCase()===name.toLowerCase())) return;
  save({ ...state, master:[...state.master, {id:uid(), name, categoryId:null}] });
}
function deleteMaster(id){
  save({ ...state, master: state.master.filter(i=>i.id!==id), shopping: state.shopping.filter(x=>x!==id) });
}
function assignCategory(itemId, categoryId){
  const cid = categoryId === UNCAT ? null : categoryId;
  save({ ...state, master: state.master.map(i => i.id===itemId ? {...i, categoryId:cid} : i) });
}
function addCategory(name){
  name = name.trim();
  if(!name) return;
  if(state.categories.some(c=>c.name.toLowerCase()===name.toLowerCase())) return;
  save({ ...state, categories:[...state.categories, {id:uid(), name}] });
}
function deleteCategory(catId){
  save({
    ...state,
    categories: state.categories.filter(c=>c.id!==catId),
    master: state.master.map(i => i.categoryId===catId ? {...i, categoryId:null} : i)
  });
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function categoryName(id){
  if(!id) return "Uncategorized";
  const c = state.categories.find(c=>c.id===id);
  return c ? c.name : "Uncategorized";
}
function orderedCategoryIds(){
  // categories in creation order, then uncategorized last
  return [...state.categories.map(c=>c.id), null];
}
function catSelectOptions(selectedId){
  const opts = state.categories.map(c =>
    `<option value="${c.id}" ${c.id===selectedId?'selected':''}>${escapeHtml(c.name)}</option>`
  ).join('');
  return `<option value="${UNCAT}" ${!selectedId?'selected':''}>No category</option>` + opts;
}

function itemRowHtml(item, shoppingSet){
  return `
    <li class="${shoppingSet.has(item.id)?'in-list':''}" data-id="${item.id}">
      <span class="dot" data-action="toggle"></span>
      <span class="name" data-action="toggle">${escapeHtml(item.name)}</span>
      <select class="cat-select" data-action="recat">${catSelectOptions(item.categoryId)}</select>
      <span class="del" data-action="delete">Remove</span>
    </li>`;
}

function render(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const shoppingSet = new Set(state.shopping);
  const filtered = state.master.filter(i => i.name.toLowerCase().includes(q));

  // group by category, in category-creation order, uncategorized last
  const groups = {};
  orderedCategoryIds().forEach(cid => groups[cid === null ? UNCAT : cid] = []);
  filtered.forEach(i => {
    const key = i.categoryId || UNCAT;
    if(!groups[key]) groups[key] = [];
    groups[key].push(i);
  });
  Object.values(groups).forEach(arr => arr.sort((a,b)=>a.name.localeCompare(b.name)));

  let html = '';
  orderedCategoryIds().forEach(cid => {
    const key = cid === null ? UNCAT : cid;
    const items = groups[key] || [];
    if(!items.length) return;
    html += `<div class="cat-group"><h3>${escapeHtml(categoryName(cid))}</h3><ul>`;
    html += items.map(i => itemRowHtml(i, shoppingSet)).join('');
    html += `</ul></div>`;
  });
  document.getElementById('masterList').innerHTML = html;
  document.getElementById('masterEmpty').style.display = filtered.length ? 'none' : 'block';

  // shopping list, grouped by category too
  const shopItems = state.master.filter(i => shoppingSet.has(i.id));
  const shopGroups = {};
  shopItems.forEach(i => {
    const key = i.categoryId || UNCAT;
    if(!shopGroups[key]) shopGroups[key] = [];
    shopGroups[key].push(i);
  });
  Object.values(shopGroups).forEach(arr => arr.sort((a,b)=>a.name.localeCompare(b.name)));
  let shopHtml = '';
  orderedCategoryIds().forEach(cid => {
    const key = cid === null ? UNCAT : cid;
    const items = shopGroups[key] || [];
    if(!items.length) return;
    shopHtml += `<div class="cat-group"><h3>${escapeHtml(categoryName(cid))}</h3><ul>`;
    shopHtml += items.map(i => `
      <li data-id="${i.id}">
        <span class="dot in-list"></span>
        <span class="name" data-action="toggle">${escapeHtml(i.name)}</span>
      </li>`).join('');
    shopHtml += `</ul></div>`;
  });
  document.getElementById('shopList').innerHTML = shopHtml;
  document.getElementById('shopEmpty').style.display = shopItems.length ? 'none' : 'block';

  const badge = document.getElementById('countBadge');
  if(shopItems.length){ badge.style.display='inline-block'; badge.textContent = shopItems.length; }
  else { badge.style.display = 'none'; }

  // category management list
  document.getElementById('catListManage').innerHTML = state.categories.length
    ? state.categories.map(c => `
        <div class="cat-row" data-cat-id="${c.id}">
          <span class="name">${escapeHtml(c.name)}</span>
          <span class="del" data-action="delete-cat">Delete</span>
        </div>`).join('')
    : `<div style="color:var(--muted); font-size:0.85rem; padding:4px 0;">No categories yet.</div>`;
}

document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  });
});
document.getElementById('addBtn').addEventListener('click', ()=>{
  const input = document.getElementById('search');
  addItem(input.value);
  input.value='';
});
document.getElementById('search').addEventListener('keydown', e=>{
  if(e.key==='Enter'){ addItem(e.target.value); e.target.value=''; }
});
document.getElementById('search').addEventListener('input', render);

document.getElementById('toggleCatManage').addEventListener('click', ()=>{
  document.getElementById('catManage').classList.toggle('hidden');
});
document.getElementById('addCatBtn').addEventListener('click', ()=>{
  const input = document.getElementById('newCatName');
  addCategory(input.value);
  input.value='';
});
document.getElementById('newCatName').addEventListener('keydown', e=>{
  if(e.key==='Enter'){ addCategory(e.target.value); e.target.value=''; }
});
document.getElementById('catListManage').addEventListener('click', e=>{
  if(e.target.dataset.action==='delete-cat'){
    const row = e.target.closest('[data-cat-id]');
    if(row) deleteCategory(row.dataset.catId);
  }
});

document.body.addEventListener('click', e=>{
  const li = e.target.closest('li[data-id]');
  if(!li) return;
  const id = li.dataset.id;
  const action = e.target.dataset.action;
  if(action==='delete') deleteMaster(id);
  else if(action==='toggle') toggleShopping(id);
});
document.body.addEventListener('change', e=>{
  if(e.target.dataset.action==='recat'){
    const li = e.target.closest('li[data-id]');
    if(li) assignCategory(li.dataset.id, e.target.value);
  }
});

state = load();
render();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
</body>
</html>
