<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grocery & Shopping List</title>
<meta name="theme-color" content="#3f7d5c">
<meta name="description" content="Keep a list of everyday items and build your shopping list with one tap.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#faf9f7; --card:#ffffff; --text:#1c1c1c; --muted:#767268;
    --accent:#3f7d5c; --accent-bg:#e7f2ec; --border:#e6e2da; --danger:#b3543f;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#171614; --card:#221f1c; --text:#f1efe9; --muted:#9b968b;
      --accent:#7fc9a0; --accent-bg:#25332b; --border:#33302b; --danger:#e08a72;
    }
  }
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; max-width:520px; margin:0 auto;
  }
  header{
    padding:18px 16px 8px; position:sticky; top:env(safe-area-inset-top,0px);
    background:var(--bg); z-index:2;
  }
  h1{font-size:1.25rem; margin:0 0 12px;}
  .tabs{display:flex; gap:8px;}
  .tab{
    flex:1; padding:10px; text-align:center; border-radius:10px; border:1px solid var(--border);
    background:var(--card); cursor:pointer; font-size:0.95rem; color:var(--muted); position:relative;
  }
  .tab.active{background:var(--accent-bg); color:var(--accent); border-color:var(--accent); font-weight:600;}
  .badge{
    display:inline-block; min-width:18px; padding:0 5px; margin-left:6px; border-radius:9px;
    background:var(--accent); color:#fff; font-size:0.72rem; line-height:18px;
  }
  main{flex:1; overflow-y:auto; padding:0 16px 24px;}
  .panel{display:none;}
  .panel.active{display:block;}
  .add-row{display:flex; gap:8px; margin:12px 0;}
  input[type="text"]{
    flex:1; padding:11px 12px; border-radius:10px; border:1px solid var(--border);
    background:var(--card); color:var(--text); font-size:1rem; min-width:0;
  }
  button{
    border:none; border-radius:10px; padding:11px 14px; font-size:0.95rem; cursor:pointer;
    background:var(--accent); color:#fff;
  }
  ul{list-style:none; margin:0; padding:0;}
  li{display:flex; align-items:center; gap:10px; padding:12px 4px; border-bottom:1px solid var(--border);}
  li .name{flex:1; word-break:break-word;}
  li.in-list .name{color:var(--accent); font-weight:600;}
  .dot{width:9px; height:9px; border-radius:50%; border:2px solid var(--border); flex:none;}
  li.in-list .dot{background:var(--accent); border-color:var(--accent);}
  .empty{color:var(--muted); text-align:center; padding:32px 0;}
  .del{color:var(--danger); font-size:0.85rem;}
</style>
</head>
<body>
<header>
  <h1>My Groceries</h1>
  <div class="tabs">
    <div class="tab active" data-tab="all">All Items</div>
    <div class="tab" data-tab="shop">Shopping List<span id="countBadge" class="badge" style="display:none">0</span></div>
  </div>
</header>
<main>
  <div id="panel-all" class="panel active">
    <div class="add-row">
      <input type="text" id="search" placeholder="Search or add an item...">
      <button id="addBtn">Add</button>
    </div>
    <ul id="masterList"></ul>
    <div id="masterEmpty" class="empty" style="display:none">No items yet — add your first one above.</div>
  </div>
  <div id="panel-shop" class="panel">
    <ul id="shopList"></ul>
    <div id="shopEmpty" class="empty">Nothing needed right now. Tap items on "All Items" to add them here.</div>
  </div>
</main>
<script>
let state = { master: [], shopping: [] };
const KEY = "grocery-app-state";

function uid(){ return Math.random().toString(36).slice(2,9); }
function load(){
  try{ const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : { master: [], shopping: [] }; }
  catch(e){ return { master: [], shopping: [] }; }
}
function save(newState){
  state = newState;
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  render();
}
function toggleShopping(id){
  const inList = state.shopping.includes(id);
  save({ ...state, shopping: inList ? state.shopping.filter(x=>x!==id) : [...state.shopping, id] });
}
function addItem(name){
  name = name.trim();
  if(!name) return;
  if(state.master.some(i=>i.name.toLowerCase()===name.toLowerCase())) return;
  save({ ...state, master:[...state.master, {id:uid(), name}] });
}
function deleteMaster(id){
  save({ master: state.master.filter(i=>i.id!==id), shopping: state.shopping.filter(x=>x!==id) });
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function render(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const shoppingSet = new Set(state.shopping);
  const filtered = state.master
    .filter(i => i.name.toLowerCase().includes(q))
    .sort((a,b)=> (shoppingSet.has(b.id)?1:0) - (shoppingSet.has(a.id)?1:0) || a.name.localeCompare(b.name));

  document.getElementById('masterList').innerHTML = filtered.map(i => `
    <li class="${shoppingSet.has(i.id)?'in-list':''}" data-id="${i.id}">
      <span class="dot" data-action="toggle"></span>
      <span class="name" data-action="toggle">${escapeHtml(i.name)}</span>
      <span class="del" data-action="delete">Remove</span>
    </li>`).join('');
  document.getElementById('masterEmpty').style.display = filtered.length ? 'none' : 'block';

  const shopItems = state.master.filter(i => shoppingSet.has(i.id)).sort((a,b)=>a.name.localeCompare(b.name));
  document.getElementById('shopList').innerHTML = shopItems.map(i => `
    <li data-id="${i.id}">
      <span class="dot in-list"></span>
      <span class="name" data-action="toggle">${escapeHtml(i.name)}</span>
    </li>`).join('');
  document.getElementById('shopEmpty').style.display = shopItems.length ? 'none' : 'block';

  const badge = document.getElementById('countBadge');
  if(shopItems.length){ badge.style.display='inline-block'; badge.textContent = shopItems.length; }
  else { badge.style.display = 'none'; }
}

document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  });
});
document.getElementById('addBtn').addEventListener('click', ()=>{
  const input = document.getElementById('search');
  addItem(input.value);
  input.value='';
});
document.getElementById('search').addEventListener('keydown', e=>{
  if(e.key==='Enter'){ addItem(e.target.value); e.target.value=''; }
});
document.getElementById('search').addEventListener('input', render);
document.body.addEventListener('click', e=>{
  const li = e.target.closest('li[data-id]');
  if(!li) return;
  const id = li.dataset.id;
  const action = e.target.dataset.action;
  if(action==='delete') deleteMaster(id);
  else if(action==='toggle') toggleShopping(id);
});

state = load();
render();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
</body>
</html>
